AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  WaviateScript Marketplace – Go Lambda behind API Gateway v2 (HTTP API).

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64

Parameters:
  DBAddr:
    Type: String
    Default: "localhost:5432"
    Description: "Postgres host:port"
  DBUser:
    Type: String
    Default: "postgres"
    Description: "Postgres user"
  DBName:
    Type: String
    Default: "waviatescript_marketplace"
    Description: "Postgres database name"

Resources:
  MarketplaceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      Handler: bootstrap
      Runtime: provided.al2023
      CodeUri: ./backend/
      Environment:
        Variables:
          MARKETPLACE_MODE: serverless
          MARKETPLACE_DB_ADDR: !Ref DBAddr
          MARKETPLACE_DB_USER: !Ref DBUser
          MARKETPLACE_DB_NAME: !Ref DBName
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

Outputs:
  MarketplaceApi:
    Description: "HTTP API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  MarketplaceFunction:
    Description: "Lambda function ARN"
    Value: !GetAtt MarketplaceFunction.Arn
